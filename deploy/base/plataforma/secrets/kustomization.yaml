# Segredos de desenvolvimento cifrados (D4 do design), tarefa 6.4. Onda -3:
# precisam existir DEPOIS do controller do Sealed Secrets (onda -4) e ANTES
# dos consumidores que os referenciam (onda -2). Cifrados com a chave de
# selagem de dev versionada em deploy/bootstrap/chave-selagem-dev.yaml --
# nao protegem nada de valor (D4), mas nao sao texto claro (D4, requisito
# "Segredo versionado apenas em forma cifrada").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres-credentials.yaml
  - valkey-credentials.yaml
  - minio-credentials.yaml
  - minio-creds-mimir.yaml
  - minio-creds-loki.yaml
  - minio-creds-tempo.yaml
  - minio-creds-postgres.yaml
  - minio-creds-app.yaml
commonAnnotations:
  argocd.argoproj.io/sync-wave: "-3"
