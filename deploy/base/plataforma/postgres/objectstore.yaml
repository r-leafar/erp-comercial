# Configuracao de backup via Barman Cloud Plugin (D8 do design). Onda -2,
# junto com o Cluster que a referencia por nome em spec.plugins.
#
# GOTCHA (encontrado ao vivo): referencia de Secret e sempre no MESMO
# namespace do recurso -- por isso existe uma copia de minio-creds-postgres
# aqui em `data` (deploy/base/plataforma/secrets/minio-creds-postgres-data-ns.yaml),
# alem da que ja existia em `storage` para o job de buckets. Mesmo valor,
# dois SealedSecrets (D4: vinculo estrito a nome+namespace nao permite um so
# servir as duas pontas).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: erp-postgres-backup
  namespace: data
spec:
  configuration:
    destinationPath: s3://postgres-backup/
    endpointURL: http://minio.storage.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: minio-creds-postgres
        key: POSTGRES_BACKUP_ACCESS_KEY
      secretAccessKey:
        name: minio-creds-postgres
        key: POSTGRES_BACKUP_SECRET_KEY
    wal:
      compression: gzip
  retentionPolicy: "30d"
