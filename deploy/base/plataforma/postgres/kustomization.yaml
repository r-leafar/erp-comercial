# Cluster de banco (D8 do design), onda -2. O operador que o reconcilia
# vive em deploy/base/plataforma/cnpg-operator (onda -4, separado por
# precisar de uma onda diferente).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster.yaml
  - scheduled-backup.yaml
commonAnnotations:
  argocd.argoproj.io/sync-wave: "-2"
