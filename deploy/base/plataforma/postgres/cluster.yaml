# Cluster de banco (D8 do design). Onda -2: depende do operador (onda -4)
# e do MinIO existir (onda -2 tambem, mesma onda -- ordem dentro da onda
# nao e garantida entre recursos distintos; se isso se provar um problema
# na pratica, mover o bucket postgres-backup para uma onda propria).
#
# Backup via Barman Cloud Plugin (deploy/base/plataforma/barman-cloud-plugin,
# onda -4), NAO mais `spec.backup.barmanObjectStore`: essa forma classica se
# mostrou nao-funcional na v1.30.0 fixada, confirmado ao vivo ("failed to
# get envs: cache miss") -- API deprecada desde a v1.26, com bug ativo
# conhecido (cloudnative-pg/cloudnative-pg#6031) e remocao prevista para a
# v1.31. A configuracao de destino/credencial mora agora em
# deploy/base/plataforma/postgres/objectstore.yaml, referenciada por nome.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: erp-postgres
  namespace: data
spec:
  instances: 1 # dev e single-node por decisao (proposal.md, non-goals)
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: erp
      owner: erp
      secret:
        name: postgres-credentials
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: erp-postgres-backup
