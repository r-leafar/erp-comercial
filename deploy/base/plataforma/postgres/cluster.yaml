# Cluster de banco (D8 do design). Onda -2: depende do operador (onda -4)
# e do MinIO existir (onda -2 tambem, mesma onda -- ordem dentro da onda
# nao e garantida entre recursos distintos; se isso se provar um problema
# na pratica, mover o bucket postgres-backup para uma onda propria).
#
# PONTO A VERIFICAR (D8): a forma de configurar archive continuo e backup
# mudou entre versoes do CloudNativePG -- confirmar contra a documentacao
# da v1.30.0 fixada se `spec.backup.barmanObjectStore` (usado abaixo,
# forma classica e mais amplamente documentada) ainda e o caminho corrente,
# ou se a versao fixada exige o plugin Barman Cloud (`ObjectStore` CRD
# separado) em seu lugar. Esta e a falha mais provavel desta capacidade e
# so a tarefa 8.7 (restauracao exercitada de verdade) prova qual forma
# funciona.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: erp-postgres
  namespace: data
spec:
  instances: 1 # dev e single-node por decisao (proposal.md, non-goals)
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: erp
      owner: erp
      secret:
        name: postgres-credentials
  backup:
    barmanObjectStore:
      destinationPath: s3://postgres-backup/
      endpointURL: http://minio.storage.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: minio-creds-postgres
          key: POSTGRES_BACKUP_ACCESS_KEY
        secretAccessKey:
          name: minio-creds-postgres
          key: POSTGRES_BACKUP_SECRET_KEY
      wal:
        compression: gzip
    retentionPolicy: "30d"
