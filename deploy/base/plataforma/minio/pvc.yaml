# Usa a classe de armazenamento PADRAO do cluster -- nao referencia
# diretorio do host nem classe exclusiva de uma forma de obter o cluster
# (D10, D11 do design; requisito verificavel na tarefa 10.6).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
