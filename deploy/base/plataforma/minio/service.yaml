# Servico interno -- este e o "endereco" do contrato de configuracao S3
# (D6 do design): minio.storage.svc.cluster.local:9000
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
