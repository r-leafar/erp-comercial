# Valkey com dois papeis (D9 do design): cache compartilhado e canal de
# publicacao/assinatura em BROADCAST -- nunca usado para efeito que precise
# ocorrer exatamente uma vez (essa e a responsabilidade do outbox
# transacional, mecanismo oposto). Perda total do cache MUST NOT causar
# perda de dado (spec plataforma/cache-distribuido) -- por isso nenhum
# volume persistente aqui: o conteudo e deliberadamente descartavel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.1-alpine
          command:
            - sh
            - -c
            - exec valkey-server --requirepass "$VALKEY_PASSWORD"
          envFrom:
            - secretRef:
                name: valkey-credentials
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning ping
            initialDelaySeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning ping
            initialDelaySeconds: 10
