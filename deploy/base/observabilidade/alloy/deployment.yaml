# Grafana Alloy (D3 do design): agente unico de coleta, distribuicao do
# OpenTelemetry Collector com os componentes nativos de metricas e logs
# embutidos no mesmo binario. Deployment (nao DaemonSet): 1 no em
# desenvolvimento torna as replicas equivalentes (D3a); em producao, o
# papel "agente por no" se separaria em DaemonSet proprio.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.19.2
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: http-ui
              containerPort: 12345
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http-ui
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /-/ready
              port: http-ui
            initialDelaySeconds: 15
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
