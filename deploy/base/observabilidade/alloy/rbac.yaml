# Permissoes de leitura em todo o cluster: descoberta de alvos de scrape
# (discovery.kubernetes), enriquecimento de origem por IP de pod
# (otelcol.processor.k8sattributes) e leitura de log de pod pela API do
# Kubernetes (loki.source.kubernetes, tarefa 2.3) -- sem hostPath, sem
# privilegio no host.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # cAdvisor (D5 de paineis-operacionais): autorizacao para chamar a API
  # do kubelet, nao so listar objetos do apiserver -- unica excecao ao
  # padrao "so leitura de objeto" desta plataforma.
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: observability
