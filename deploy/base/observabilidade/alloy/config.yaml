# Configuracao do Alloy (D3, D3a do design). Papeis acumulados em
# desenvolvimento: uma unica instancia recebe OTLP (porta de entrada) E
# faz scrape/coleta de log de infraestrutura (agente por no) -- em
# producao, com mais de um no, esses papeis se separam (D3a, tarefa 1.3).
# Nao ambiente-especifico: os enderecos de Tempo/Mimir/Loki sao servicos
# internos estaveis em qualquer ambiente que rode esta plataforma, por
# isso fica em base, nao na sobreposicao (diferente do tempo/mimir/loki
# -config.yaml, cujo conteudo de retencao/S3 e especifico do ambiente).
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  config.alloy: |
    // Ponto unico de ingestao (D1, tarefa 1.2): os tres sinais entram por
    // OTLP, e quem emite nao conhece o destino de cada um.
    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        metrics = [otelcol.processor.memory_limiter.default.input]
        logs    = [otelcol.processor.memory_limiter.default.input]
        traces  = [otelcol.processor.memory_limiter.default.input]
      }
    }

    // Isolamento entre telemetria e quem a emite (D10, tarefas 1.6, 1.10):
    // acima do limite, o excedente e recusado (nunca acumulado sem limite),
    // e a recusa incrementa as metricas otelcol_processor_refused_* --
    // descarte contabilizado, nunca silencioso (tarefa 1.7).
    otelcol.processor.memory_limiter "default" {
      check_interval           = "1s"
      limit_percentage         = 75
      spike_limit_percentage   = 15
      output {
        metrics = [otelcol.processor.transform.strip_forged_origin.input]
        logs    = [otelcol.processor.transform.strip_forged_origin.input]
        traces  = [otelcol.processor.transform.strip_forged_origin.input]
      }
    }

    // Precedencia do atributo de origem (D2, tarefa 1.9): confirmado ao
    // vivo que otelcol.processor.k8sattributes SO ACRESCENTA atributo
    // ausente -- nao sobrescreve um k8s.* que o emissor ja tenha
    // declarado (nao existe otelcol.processor.resource nesta distribuicao
    // do Alloy; a remocao precisa da linguagem de transformacao OTTL).
    // Removendo antes do enriquecimento, o k8sattributes sempre parte de
    // um estado limpo e o valor derivado do ambiente sempre prevalece.
    otelcol.processor.transform "strip_forged_origin" {
      error_mode = "ignore"
      trace_statements {
        context    = "resource"
        statements = [
          `delete_key(attributes, "k8s.namespace.name")`,
          `delete_key(attributes, "k8s.pod.name")`,
          `delete_key(attributes, "k8s.pod.uid")`,
          `delete_key(attributes, "k8s.node.name")`,
        ]
      }
      metric_statements {
        context    = "resource"
        statements = [
          `delete_key(attributes, "k8s.namespace.name")`,
          `delete_key(attributes, "k8s.pod.name")`,
          `delete_key(attributes, "k8s.pod.uid")`,
          `delete_key(attributes, "k8s.node.name")`,
        ]
      }
      log_statements {
        context    = "resource"
        statements = [
          `delete_key(attributes, "k8s.namespace.name")`,
          `delete_key(attributes, "k8s.pod.name")`,
          `delete_key(attributes, "k8s.pod.uid")`,
          `delete_key(attributes, "k8s.node.name")`,
        ]
      }
      output {
        metrics = [otelcol.processor.k8sattributes.default.input]
        logs    = [otelcol.processor.k8sattributes.default.input]
        traces  = [otelcol.processor.k8sattributes.default.input]
      }
    }

    // Enriquecimento com identidade de origem, derivado do ambiente de
    // execucao (D2, tarefa 1.5): associa o registro ao pod de origem pelo
    // IP de conexao. O processor acima ja garantiu que nenhum k8s.* forjado
    // sobrevive ate aqui (tarefa 1.9).
    otelcol.processor.k8sattributes "default" {
      extract {
        metadata = [
          "k8s.namespace.name",
          "k8s.pod.name",
          "k8s.pod.uid",
          "k8s.node.name",
        ]
      }
      output {
        metrics = [otelcol.processor.batch.default.input]
        logs    = [otelcol.processor.transform.loki_labels.input]
        traces  = [otelcol.processor.batch.default.input]
      }
    }

    // Correlacao rastro->logs (D7, tarefa 7.2). CONFIRMADO AO VIVO: o log
    // recebido por OTLP (emissor sintetico, futura aplicacao) NAO promove
    // nenhum atributo a rotulo do Loki por padrao -- so o log coletado de
    // pod (loki.source.kubernetes) tem namespace/pod como rotulo real,
    // porque o discovery.relabel promove isso explicitamente. Sem rotulo,
    // a navegacao "rastro -> logs" do Grafana (que filtra por rotulo) nao
    // encontra nada. As dicas loki.resource.labels/loki.attribute.labels
    // dizem ao exportador quais atributos promover a rotulo real desta
    // remessa.
    otelcol.processor.transform "loki_labels" {
      error_mode = "ignore"
      log_statements {
        context    = "resource"
        statements = [
          `set(attributes["loki.resource.labels"], "k8s.namespace.name, k8s.pod.name")`,
        ]
      }
      log_statements {
        context    = "log"
        statements = [
          `set(attributes["trace_id"], trace_id.string) where trace_id.string != ""`,
          `set(attributes["loki.attribute.labels"], "trace_id")`,
        ]
      }
      output {
        logs = [otelcol.processor.batch.default.input]
      }
    }

    // Agrupamento em lotes (tarefa 1.6).
    otelcol.processor.batch "default" {
      send_batch_size = 1000
      timeout         = "5s"
      output {
        metrics = [otelcol.exporter.prometheus.default.input]
        logs    = [otelcol.exporter.loki.default.input]
        traces  = [otelcol.exporter.otlp.tempo.input]
      }
    }

    // Escrita nativa no armazenamento de rastros, sem camada de traducao
    // (D3): exportador OTLP embutido no proprio agente.
    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo.observability.svc.cluster.local:4317"
        tls {
          insecure = true
        }
      }
    }

    // Ponte nativa OTLP -> formato do Loki (D3: embutida no agente, sem
    // processo de traducao separado), unificando o log recebido por OTLP
    // com o log de pod coletado abaixo no MESMO caminho de escrita.
    otelcol.exporter.loki "default" {
      forward_to = [loki.write.default.receiver]
    }

    // Ponte nativa OTLP -> formato do Prometheus (D3), unificando a
    // metrica recebida por OTLP com a metrica de infraestrutura raspada
    // abaixo no MESMO caminho de escrita.
    otelcol.exporter.prometheus "default" {
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
      }
    }

    prometheus.remote_write "mimir" {
      endpoint {
        url = "http://mimir.observability.svc.cluster.local:8080/api/v1/push"
      }
    }

    // Coleta de metricas dos componentes de infraestrutura (secao 2): scrape
    // nativo com descoberta de alvos no cluster, convencao
    // prometheus.io/scrape (a mesma que o cert-manager ja publica) -- sem
    // lista fixa de enderecos (tarefa 2.1).
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "scrape_annotated" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        regex         = "true"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
      }
      rule {
        source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
        regex         = "([^:]+)(?::\\d+)?;(\\d+)"
        replacement   = "$1:$2"
        target_label  = "__address__"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    prometheus.scrape "infra" {
      targets    = discovery.relabel.scrape_annotated.output
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    // O proprio agente tambem e um componente de infraestrutura: sua
    // metrica de descarte (otelcol_processor_refused_*, tarefa 1.7) so e
    // consultavel se o agente raspar a si mesmo.
    prometheus.scrape "self" {
      targets    = [{"__address__" = "localhost:12345"}]
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    // Coleta nativa de log de pod pela API do Kubernetes (tarefa 2.3), sem
    // hostPath: mesma fonte de descoberta do scrape, mas sem o filtro de
    // anotacao -- log de infraestrutura interessa de qualquer pod.
    discovery.relabel "pods_for_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods_for_logs.output
      forward_to = [loki.write.default.receiver]
    }
