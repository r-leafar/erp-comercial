# Provisionamento de paineis (D4 do design de paineis-operacionais):
# arquivo apontando para uma pasta, mesmo mecanismo ja usado para
# datasources.yaml -- sem container sidecar adicional (alternativa
# recusada em D4).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: paineis-operacionais
        orgId: 1
        folder: ""
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
