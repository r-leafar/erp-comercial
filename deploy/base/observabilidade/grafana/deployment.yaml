# Interface de consulta unica para os tres sinais (D7 do design de
# `observabilidade`), com paineis de saude operacional (host, Kubernetes,
# Postgres) provisionados por `paineis-operacionais` -- ainda sem painel
# de negocio ou de aplicacao (non-goal, ambas as changes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.2.1
          envFrom:
            - secretRef:
                name: grafana-credentials
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          # Banco proprio do Grafana (sessao, preferencias) -- as fontes de
          # dados sao reprovisionadas do ConfigMap a cada subida (tarefa
          # 7.6), entao perder isto num reinicio nao perde a capacidade de
          # consulta. Mesma propriedade de dev ja registrada nos demais
          # componentes desta change.
          emptyDir: {}
