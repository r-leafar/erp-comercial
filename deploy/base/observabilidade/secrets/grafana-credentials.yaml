# Credencial de admin do Grafana (usuario/senha de dev, D4 de
# plataforma-gitops). Nao protege nada de valor -- mesma chave de
# selagem de dev versionada em deploy/bootstrap/chave-selagem-dev.yaml.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-credentials
  namespace: observability
spec:
  encryptedData:
    GF_SECURITY_ADMIN_PASSWORD: 
    GF_SECURITY_ADMIN_USER: 
  template:
    metadata:
      name: grafana-credentials
      namespace: observability
