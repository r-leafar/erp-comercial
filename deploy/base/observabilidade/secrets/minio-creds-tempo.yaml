# Copia da credencial provisionada em plataforma-gitops (namespace storage),
# reselada para o namespace observability -- mesmo padrao usado para
# minio-creds-postgres-data-ns.yaml (D8 de plataforma-gitops): o valor NAO
# foi regenerado, so extraido ao vivo do Secret ja em uso e reselado para o
# namespace onde o consumidor desta change roda.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: minio-creds-tempo
  namespace: observability
spec:
  encryptedData:
    TEMPO_ACCESS_KEY: 
    TEMPO_SECRET_KEY: 
  template:
    metadata:
      name: minio-creds-tempo
      namespace: observability
