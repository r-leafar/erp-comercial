# Segredos desta change, cifrados com a mesma chave de selagem de dev de
# plataforma-gitops. Onda -3: depois do controller do Sealed Secrets
# (onda -4, plataforma-gitops) e antes dos armazenamentos que os referenciam
# (onda 0 nesta change).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - minio-creds-mimir.yaml
  - minio-creds-loki.yaml
  - minio-creds-tempo.yaml
  - grafana-credentials.yaml
commonAnnotations:
  argocd.argoproj.io/sync-wave: "-3"
