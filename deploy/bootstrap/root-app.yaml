# Application raiz do ArgoCD. A partir daqui, o estado do cluster e
# derivado deste caminho do repositorio (D1 do design) -- nenhum
# kubectl apply imperativo depois deste.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plataforma-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/r-leafar/erp-comercial.git
    targetRevision: main
    path: deploy/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
