# Application raiz do ArgoCD. A partir daqui, o estado do cluster e
# derivado deste caminho do repositorio (D1 do design) -- nenhum
# kubectl apply imperativo depois deste.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plataforma-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/r-leafar/erp-comercial.git
    targetRevision: main
    path: deploy/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # As CRDs do CloudNativePG e do Sealed Secrets sao grandes o
      # bastante para estourar o limite de 256 KiB da anotacao
      # last-applied-configuration que o apply client-side (padrao)
      # usa -- mesmo problema corrigido em install-argocd.sh, so que
      # dentro do proprio ArgoCD. Server-side apply nao depende dela.
      - ServerSideApply=true
