# Chave de selagem de DESENVOLVIMENTO do Sealed Secrets (D4 do design).
#
# NAO PROTEGE NADA DE VALOR. E versionada deliberadamente para que o
# ambiente continue recriavel apos recriar o cluster (a chave de selagem
# real e gerada por cluster; sem restaurar esta, todo SealedSecret ja
# versionado se torna indecifravel). Em producao, o tratamento e outro:
# a chave e material sensivel, fica fora do repositorio e tem backup proprio.
#
# Restaurada por deploy/bootstrap/restore-sealing-key.sh, ANTES de qualquer
# SealedSecret ser aplicado (onda -3). Gerada com:
#   openssl req -x509 -nodes -newkey rsa:4096 -keyout tls.key -out tls.crt \
#     -days 36500 -subj "/CN=sealed-secret/O=sealed-secret"
apiVersion: v1
kind: Secret
metadata:
  name: sealed-secrets-key-dev
  namespace: sealed-secrets
  labels:
    sealedsecrets.bitnami.com/sealed-secrets-key: active
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
