# Overlay de DESENVOLVIMENTO (D2 do design). So contem as DIFERENCAS: MinIO
# local, sem TLS, credenciais fixas versionadas, 1 replica, sem redundancia
# -- propriedades de dev que NAO valem em producao (ver proposal.md,
# "Risco assumido e registrado").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/plataforma/namespaces
  - ../../base/plataforma/cert-manager
  - ../../base/plataforma/sealed-secrets
  - ../../base/plataforma/secrets
  - ../../base/plataforma/cnpg-operator
  - ../../base/plataforma/barman-cloud-plugin
  - ../../base/plataforma/postgres
  - ../../base/plataforma/valkey
  - ../../base/plataforma/minio
  - ../../base/plataforma/minio-provision
  - ../../base/observabilidade/secrets
  - ../../base/observabilidade/tempo
  - ../../base/observabilidade/mimir
  - ../../base/observabilidade/loki
  - ../../base/observabilidade/alloy
  - ../../base/observabilidade/grafana
  - tempo-config.yaml
  - mimir-config.yaml
  - loki-config.yaml
  - ingress-argocd.yaml
  - ingress-minio.yaml
  - ingress-grafana.yaml
