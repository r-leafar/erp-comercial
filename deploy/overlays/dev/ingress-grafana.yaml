# Mesmo padrao do ingress-argocd.yaml/ingress-minio.yaml (plataforma-gitops):
# API generica, host via nip.io, sem TLS. NAO abre no navegador em WSL2 --
# ver deploy/README.md, "Acessando os paineis": use kubectl port-forward.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  rules:
    - host: grafana.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
