# Configuracao real do Loki -- ambiente-especifica (contrato S3 de dev, ver
# deploy/README.md) e a janela de retencao de DEV (tarefa 5.4, curta pelo
# mesmo motivo do Tempo/Mimir). retention_enabled + delete_request_store
# ativados EXPLICITAMENTE (tarefa 5.5): declarar retention_period sem isso
# nao apaga nada (D5 do design).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /data/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      aws:
        endpoint: minio.storage.svc.cluster.local:9000
        region: us-east-1
        bucketnames: loki-chunks
        access_key_id: ${LOKI_ACCESS_KEY}
        secret_access_key: ${LOKI_SECRET_KEY}
        s3forcepathstyle: true
        insecure: true
      tsdb_shipper:
        active_index_directory: /data/loki/tsdb-index
        cache_location: /data/loki/tsdb-cache

    compactor:
      working_directory: /data/loki/compactor
      retention_enabled: true
      retention_delete_delay: 10m
      delete_request_store: s3

    limits_config:
      retention_period: 2h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
